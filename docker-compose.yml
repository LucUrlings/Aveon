services:
  aveon:
    image: ghcr.io/lucurlings/aveon:latest
    container_name: aveon
    restart: unless-stopped
    depends_on:
      aveon-redis:
        condition: service_healthy
      aveon-postgres:
        condition: service_healthy
    ports:
      - "${AVEON_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      FlightApi__ApiKey: ${FLIGHTAPI_API_KEY}
      Redis__ConnectionString: aveon-redis:6379
      Redis__FlightApiOneWayTtlMinutes: ${REDIS_FLIGHT_API_ONE_WAY_TTL_MINUTES:-30}
      Redis__AirportDataTtlMinutes: ${REDIS_AIRPORT_DATA_TTL_MINUTES:-10080}
      Redis__SearchSessionTtlMinutes: ${REDIS_SEARCH_SESSION_TTL_MINUTES:-30}
      Search__AnonymousMaxSearchCombinations: ${SEARCH_ANONYMOUS_MAX_SEARCH_COMBINATIONS:-15}
      Search__UserMaxSearchCombinations: ${SEARCH_USER_MAX_SEARCH_COMBINATIONS:-100}
      ConnectionStrings__Default: Host=aveon-postgres;Port=5432;Database=${POSTGRES_DB:-aveon};Username=${POSTGRES_USER:-aveon};Password=${POSTGRES_PASSWORD:-aveon_dev_password}
    networks:
      - aveon-network

  aveon-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aveon}
      POSTGRES_USER: ${POSTGRES_USER:-aveon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aveon_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - aveon-postgres-data:/var/lib/postgresql
    networks:
      - aveon-network

  aveon-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - aveon-redis-data:/data
    networks:
      - aveon-network

volumes:
  aveon-redis-data:
  aveon-postgres-data:

networks:
  aveon-network:
