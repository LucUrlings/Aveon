services:
  aveon:
    image: ghcr.io/lucurlings/aveon:latest
    container_name: aveon
    restart: unless-stopped
    depends_on:
      aveon-redis:
        condition: service_healthy
      aveon-postgres:
        condition: service_healthy
    ports:
      - "${AVEON_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AVEON_PUBLIC_URL: ${AVEON_PUBLIC_URL:-}
      FlightApi__ApiKey: ${FLIGHTAPI_API_KEY}
      FlightApi__MaxConcurrentRequests: ${FLIGHTAPI_MAX_CONCURRENT_REQUESTS:-5}
      FlightApi__MaxSchedulePages: ${FLIGHTAPI_MAX_SCHEDULE_PAGES:-10}
      Redis__ConnectionString: aveon-redis:6379
      Redis__FlightApiOneWayTtlMinutes: ${REDIS_FLIGHT_API_ONE_WAY_TTL_MINUTES:-30}
      Redis__AirportDataTtlMinutes: ${REDIS_AIRPORT_DATA_TTL_MINUTES:-10080}
      Redis__ExploreRoutesTtlMinutes: ${REDIS_EXPLORE_ROUTES_TTL_MINUTES:-10080}
      Redis__HeroRoutesTtlMinutes: ${REDIS_HERO_ROUTES_TTL_MINUTES:-43200}
      Redis__ExploreRoutesRetentionMinutes: ${REDIS_EXPLORE_ROUTES_RETENTION_MINUTES:-43200}
      Redis__HeroRoutesRetentionMinutes: ${REDIS_HERO_ROUTES_RETENTION_MINUTES:-129600}
      Redis__SearchSessionTtlMinutes: ${REDIS_SEARCH_SESSION_TTL_MINUTES:-30}
      Search__AnonymousMaxSearchCombinations: ${SEARCH_ANONYMOUS_MAX_SEARCH_COMBINATIONS:-15}
      Search__UserMaxSearchCombinations: ${SEARCH_USER_MAX_SEARCH_COMBINATIONS:-100}
      Search__ExecutionTimeoutMinutes: ${SEARCH_EXECUTION_TIMEOUT_MINUTES:-10}
      MultiDestinationSearch__Enabled: ${MULTI_DESTINATION_SEARCH_ENABLED:-true}
      MultiDestinationSearch__AnonymousMaxProviderCalls: ${MULTI_DESTINATION_ANONYMOUS_MAX_PROVIDER_CALLS:-25}
      MultiDestinationSearch__UserMaxProviderCalls: ${MULTI_DESTINATION_USER_MAX_PROVIDER_CALLS:-100}
      MultiDestinationSearch__AdminMaxProviderCalls: ${MULTI_DESTINATION_ADMIN_MAX_PROVIDER_CALLS:-250}
      MultiDestinationSearch__ExecutionTimeoutMinutes: ${MULTI_DESTINATION_EXECUTION_TIMEOUT_MINUTES:-10}
      MultiDestinationSearch__MaxActiveStates: ${MULTI_DESTINATION_MAX_ACTIVE_STATES:-10000}
      MultiDestinationSearch__MaxEvaluatedStates: ${MULTI_DESTINATION_MAX_EVALUATED_STATES:-500000}
      ConnectionStrings__Default: Host=aveon-postgres;Port=5432;Database=${POSTGRES_DB:-aveon};Username=${POSTGRES_USER:-aveon};Password=${POSTGRES_PASSWORD:-aveon_dev_password}
    networks:
      - aveon-network

  aveon-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aveon}
      POSTGRES_USER: ${POSTGRES_USER:-aveon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aveon_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - aveon-postgres-data:/var/lib/postgresql
    networks:
      - aveon-network

  aveon-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - aveon-redis-data:/data
    networks:
      - aveon-network

volumes:
  aveon-redis-data:
  aveon-postgres-data:

networks:
  aveon-network:
